metadata:
  version: V27-heterogeneous-family
  title: 公开证据约束的代表性交流电驱陆地钻机标定
  reviewed_on: '2026-08-31'
  target_scope: 约250—375吨、约4000 m井深、电网-柴油机-储能混合供能的陆地钻机
  claim_boundary: publicly constrained heterogeneous simulation, not field or HIL
    validation
  calibration_rule: 优先用现场研究标定运行分布，用厂家资料限制设备上限，用专利和行业案例交叉核对架构，无公开真值者必须标为工程假设
sources:
- id: P_DAI_2019
  source_type: peer_reviewed_paper
  title: Analysis of the Peak Load Leveling Mode of a Hybrid Power System with Flywheel
    Energy Storage in Oil Drilling Rig
  year: 2019
  identifier: doi:10.3390/en12040606
  url: https://www.mdpi.com/1996-1073/12/4/606
  used_for:
  - installed_capacity
  - base_and_peak_load
  - tripping_period
  - anti_overclaim
  evidence: 总装机2—3 MW；峰900—1200 kW、谷200—600 kW；起下钻周期2—4 min；储能节油受机组容量匹配显著影响
  confidence: high
- id: P_CIPEK_2016
  source_type: peer_reviewed_paper
  title: Oil drilling rig diesel power-plant fuel efficiency improvement potentials
    through rule-based generator scheduling and utilization of battery energy storage
    system
  year: 2016
  identifier: doi:10.1016/j.enconman.2016.05.022
  url: https://www.sciencedirect.com/science/article/pii/S0196890416303909
  used_for:
  - generator_fleet
  - storage_energy
  - fuel_saving_boundary
  evidence: 30天实际钻机微网数据；4台875 kVA/700 kW机组；最恶劣储能事件94 kWh，按80%DOD得117.5 kWh；仿真节油约12%
  confidence: high
- id: P_CHUPIN_2022
  source_type: peer_reviewed_paper
  title: Energy storage systems for drilling rigs
  year: 2022
  identifier: doi:10.1007/s13202-021-01248-5
  url: https://link.springer.com/article/10.1007/s13202-021-01248-5
  used_for:
  - daily_average_load
  - storage_power_energy
  - transient_support
  - storage_size
  evidence: 20台钻机2017—2019测量；日均功率350—500 kW；经济储能150—350 kWh；电池500 kW/120 s；原型133 kWh
  confidence: high
- id: P_FIELD_2025
  source_type: peer_reviewed_paper
  title: Research on superposition-level dual power allocation control strategy for
    energy storage integration in electrified oil rigs
  year: 2025
  url: https://www.sciencedirect.com/science/article/pii/S2352467725003108
  used_for:
  - sampling_density
  - overall_load
  - drilling_load
  - ramp_rate
  - grid_rating
  evidence: 4000 m井、90天、约700万点；10 kV/2500 kVA；整体均值523 kW；钻进均值1060 kW、最大1561 kW；多工况突变率超过41
    kW/s
  confidence: medium_high
  limitation: 详细分工况数字由出版商索引页和可见预览交叉核对，未获得作者原始序列
- id: PAT_US8446037
  source_type: patent
  title: Power system for a drilling rig
  year: 2013
  identifier: US8446037B2
  url: https://patents.google.com/patent/US8446037B2/en
  used_for:
  - base_load
  - intermittent_peak
  - dc_bus_architecture
  evidence: 基础负荷约400—600 kW/更宽600—800 kW；间歇峰1.5 MW、可达2.0 MW；峰值为基荷的2—3倍
  confidence: medium
- id: PAT_US20130271083
  source_type: patent
  title: Drilling rig power management system
  year: 2013
  identifier: US20130271083A1
  url: https://patents.google.com/patent/US20130271083A1/en
  used_for:
  - high_dynamic_load
  - engine_loading_policy
  evidence: 发动机容量覆盖平均负荷，储能支持最大短时需求；披露的一种控制使开机发动机不低于80%运行
  confidence: medium
- id: PAT_CN112736976
  source_type: patent
  title: 钻机混合微电网管理系统
  year: 2021
