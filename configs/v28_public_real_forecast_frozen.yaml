protocol:
  id: V28-B-PUBLIC-ELECTRICAL-JOINT-FORECAST-FROZEN-20260921
  status: frozen_before_any_listed_test_target_was_read
  frozen_date: '2026-09-21'
  random_seed: 20260921
  primary_horizon_minutes: 1
  secondary_horizons_minutes: [15, 60]
  split_rule: chronological_60_20_20_by_wall_clock_with_one_full_utc_day_gap
  analysis_unit: utc_day_nested_within_dataset
  tests_may_be_opened: true
  open_once_policy: report_every_listed_dataset_and_horizon_regardless_of_direction
  development_disclosure: >-
    Training/validation portions of REFIT House4 and UCI were used for pipeline
    development. No listed test target was read. The previously opened OpenCEM
    test period is excluded from confirmation and retained as exploratory only.

shared_forecast:
  target: measured_load_kw
  load_lags_minutes: [0, 1, 5, 15, 30, 60, 120]
  rolling_windows_minutes: [5, 15, 60, 120]
  candidate_models: [ridge, hist_gradient_boosting]
  selection_rule: lowest_validation_mae_then_refit_on_train_plus_validation
  mandatory_baselines: [persistence, rolling_mean_60]
  primary_metric: mase
  companion_metrics: [mae_kw, rmse_kw, nmae_mean_load, bias_kw]
  mase_scale: mean_absolute_one_step_change_on_adjacent_quality_ok_training_minutes
  paired_interval:
    unit: utc_day
    method: cluster_bootstrap
    replicates: 2000
    confidence_level: 0.95
  multiplicity:
    primary_family: selected_model_vs_persistence_at_1_minute_across_8_datasets
    adjustment: holm
    secondary_horizons: descriptive_with_unadjusted_intervals

