  - parameter: tripping_load_period
    public_value: "绞车脉冲周期约2—4 min；另一研究给出0到最大负荷变化约5—7 min"
    selected_value: "主周期5—7 min，短时动作叠加"
    source_type: peer_reviewed_papers
    source_url: "https://www.mdpi.com/1996-1073/12/4/606"
    supporting_url: "https://www.mdpi.com/1996-1073/15/5/1865"
