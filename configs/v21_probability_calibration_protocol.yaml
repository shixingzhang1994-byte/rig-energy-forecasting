protocol:
  id: V21-PROBABILITY-CALIBRATION-HOLDOUT-20260909
  status: declared_after_V20_development_failure_and_before_any_V21_holdout_outcome
  rationale: test the probability-quality signal identified in V20 without claiming classification superiority
  development_evidence: artifacts/v20_evidential_calibration/development_audit.json
  candidate_source: V20 candidate 9 selected descriptively by the predeclared Brier ranking
  prospective_holdout_seed_order: [20261040, 20261041, 20261042, 20261043, 20261044, 20261045, 20261046, 20261047, 20261048, 20261049, 20261050, 20261051]
  required_eligible_holdouts: 6
  stopping_rule: retain seeds in queue order and stop at the first six upstream-eligible seeds
  previously_revealed_seed_results_prohibited: [20261008, 20261009, 20261022, 20261023, 20261024, 20261025, 20261026, 20261027, 20261028, 20261029, 20261034, 20261035, 20261036, 20261037]

frozen_candidate:
  combination_rule: dempster_normalized
  scalar_temperature: 0.50
  inherited_from: V19 candidate 59
  dispatch_uses: raw_Dempster_pignistic_probability
  calibrated_probability_uses: probability_quality_reporting_only
  conflict_reporting: raw_conjunctive_conflict_retained
  total_conflict_policy: full_ignorance_fallback_with_explicit_counter

estimands:
  primary_calibration: calibrated_Dempster_Brier_minus_raw_Dempster_Brier
  decomposition:
    rule_effect: raw_Dempster_Brier_minus_raw_V19_Yager_Brier
    total_effect: calibrated_Dempster_Brier_minus_raw_V19_Yager_Brier
  context:
    - calibrated_Dempster_Brier_minus_frozen_RSS_Brier
    - macro_F1_minus_frozen_RSS_Macro_F1
    - high_risk_and_severe_recall
    - candidate_action_minus_frozen_RSS_action
    - candidate_unserved_energy_and_cost_minus_frozen_RSS
  analysis_unit: seed_with_three_dispatch_scenarios_clustered_within_seed

acceptance:
  probability:
    require_calibration_brier_improvement_on_at_least_seeds: 5
    require_mean_calibration_brier_delta_below: 0.00
    require_mean_candidate_brier_not_worse_than_RSS_by_more_than: 0.005
  recognition_noninferiority:
    require_mean_macro_f1_delta_vs_RSS_at_least: -0.01
    require_every_seed_high_risk_recall_at_least: 0.97
    require_every_seed_severe_recall_at_least: 0.95
  control_safety:
    require_aggregate_unserved_not_worse_than_RSS_kwh: 1.0e-9
    maximum_risk_adjusted_cost_ratio_vs_RSS: 1.005
    require_all_physical_audits_pass: true
  numerical:
    maximum_probability_row_sum_error: 1.0e-12
    require_zero_total_conflict_fallback_rows: true
  statistics:
    exact_two_sided_sign_flip_per_endpoint: true
    seed_bootstrap_resamples: 20000
    bootstrap_seed: 20260909
    p_values_are_descriptive_endpoint_wise: true
    minimum_attainable_two_sided_p_at_n6: 0.03125

claim_boundary:
  - V20 failed its original composite development gates and that negative result remains authoritative.
  - V21 is a distinct, post-development, prospectively frozen calibration study.
  - V21 does not test or claim classification superiority.
  - Scalar calibration does not enter dispatch and cannot be credited with action or control changes.
  - Dempster rule effects and scalar-calibration effects are decomposed rather than conflated.
  - Raw conflict remains visible despite Dempster normalization.
  - Null, adverse, and failed-gate outcomes are retained.
  - Evidence remains synthetic simulation, not field, HIL, or causal-effect validation.
