claim_gates:
  taskbook_method_and_simulation:
    status: TECHNICALLY_READY_WITH_LIMITATIONS
    allowed_claim: "形成钻机源-荷-储协同优化原型，并在公开证据约束仿真和用户指定72小时数据上完成竞争性回放"
  field_validated_power_forecasting:
    status: NOT_PROVEN
    unblock: "独立于当前开发的数据，至少一次班次的母线有功功率记录或有来源责任人的历史表计导出"
  statistical_sota:
    status: PROHIBITED
  operational_load_shedding:
    status: NOT_APPROVED
    unblock: "钻井、机电和HSE共同签字的负荷分级/HAZOP"
  target_equipment_parameters:
    status: ROBUST_ENVELOPE_ONLY
    unblock: "设备铭牌、说明书、调试记录或目标设备历史数据中的任一可追溯组合"

minimum_external_confirmation:
  preferred: "从现有电能表/保护装置/EMS历史库导出一次班次数据，不新增传感器"
  fallback: "由持证电气人员在钻机总进线使用便携式三相功率质量记录仪，连续8-12小时，1秒记录后聚合到5秒"
  required_fields:
    - timestamp
    - total_active_power_kw
    - quality_flag
    - operation_state_or_event_marker
  optional_fields:
    - grid_active_power_kw
    - aggregate_genset_power_kw
    - storage_power_kw
    - storage_soc_pct
    - available_supply_kw
  safety: "不允许项目人员自行打开带电柜、钳接高压回路或绕过现场电气许可"

stop_rules:
  - "V17已见72小时不再用于模型选择"
  - "在没有新独立功率数据前停止预测网络搜索"
  - "公开真实过程数据只做真实性锚点，不制造功率性能数字"
  - "后续论文/专利写作不得改变冻结指标、证据类别和失败记录"
