claim_policy:
  allow:
    - real drilling-process external validation
    - cross-dataset state and transition plausibility checks
    - mechanical and hydraulic proxy analysis with explicit units and caveats
    - cross-domain electrical load forecasting on named measured datasets
    - hybrid counterfactual replay driven by measured electrical load trajectories
  prohibit:
    - measured rig-bus power validation without an active-power channel
    - target-rig field validation
    - using Petrobras 3W production anomalies as power-system risk labels
    - describing public household or microgrid power as drilling-rig field power
    - reusing the opened OpenCEM pilot period as a confirmatory holdout
