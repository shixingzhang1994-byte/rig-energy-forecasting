excluded_from_confirmation:
  opencem:
    reason: >-
      The planned 2026-03-02 through 2026-04-07 test period was opened during
      pipeline development before the joint three-dataset freeze.
    permitted_use: exploratory_pipeline_pilot_and_dispatch_development_only
  mesa_del_sol:
    reason: current network validation blocks raw file acquisition
    permitted_use: metadata_only_until_verified_download

claim_boundaries:
  allow:
    - cross-domain point-forecast validation on named measured electrical datasets
    - report heterogeneous or adverse results without dataset substitution
  prohibit:
