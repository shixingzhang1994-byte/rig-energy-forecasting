protocol:
  id: V28-B-PUBLIC-ELECTRICAL-JOINT-FORECAST-DRAFT-20260921
  status: draft_tests_locked
  tests_may_be_opened: false
  reason_not_frozen: tsukuba_download_and_channel_contract_pending
  random_seed: 20260921
  primary_horizon_minutes: 1
  secondary_horizons_minutes: [15, 60]
  split_rule: chronological_60_20_20_by_wall_clock_with_boundary_gap
  analysis_unit: utc_day_nested_within_dataset

shared_forecast:
  target: measured_load_kw
  load_lags_minutes: [0, 1, 5, 15, 30, 60, 120]
  rolling_windows_minutes: [5, 15, 60, 120]
  base_models:
    ridge:
      alpha: 10.0
    hist_gradient_boosting:
      loss: absolute_error
      learning_rate: 0.06
      max_iter: 250
      max_leaf_nodes: 31
      min_samples_leaf: 40
      l2_regularization: 1.0
      early_stopping: false
  ensemble:
    method: nonnegative_convex_validation_weighting
    l2_penalty: 0.0001
  causal_error_feedback:
    release_rule: update_only_when_prior_target_timestamp_is_not_after_current_origin
    smoothing: 0.05
    correction_clip_training_mase_multipler: 5.0
  mandatory_baselines: [persistence, rolling_mean_60, ridge, hist_gradient_boosting]
  primary_metric: mase
  companion_metrics: [mae_kw, rmse_kw, nmae_mean_load, bias_kw]
  paired_interval:
    unit: utc_day
    method: cluster_bootstrap
    replicates: 2000
    confidence_level: 0.95
  probability_scenarios:
    status: pending_implementation_before_freeze
    source: validation_residuals_only
    preserve_complete_horizon_vectors: true

