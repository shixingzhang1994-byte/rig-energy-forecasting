protocol:
  name: v4-state-aware-patch-gpu-search
  development_seeds: [20260828, 20260829]
  holdout_seeds: [20260830, 20260831]
  history_steps: 120
  horizon_steps: 12
  train_fraction: 0.70
  val_fraction: 0.15
  train_stride: 2
  eval_stride: 2
  batch_size: 1024
  num_workers: 2
  max_epochs: 24
  patience: 5
  weight_decay: 0.0001
  peak_quantile: 0.90
  selection_weights:
    mae: 0.60
    transition_mae: 0.40

patchtst_anchor:
  patch_length: 16
  patch_stride: 8
  hidden_size: 64
  attention_heads: 4
  layers: 2
  dropout: 0.10
  learning_rate: 0.001

